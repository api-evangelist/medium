description: >-
  Medium publishes NO pricing or plans for its API. The API documentation has no pricing section,
  there is no developer plan page, and access is not sold — it was granted by integration token and
  is now closed to new integrations entirely. Medium's consumer membership ($5/month) and Partner
  Program are reader/writer products, not API plans, and buying one grants no additional API access.
plan_count: 0
plans: []
note: >-
  REPLACES A FABRICATED SCAFFOLD. The previous version of this file listed Free / Professional /
  Enterprise tiers with 1,000, 100,000 and unlimited monthly request quotas and per-minute limits of
  10/100/1,000. Medium publishes none of those numbers; they were bulk-sweep scaffold defaults
  (method: generated, dated 2026-05-04) that read as provider-published pricing. A plan_count of 0
  with this note is the honest measurement.
evidence:
  - url: https://github.com/Medium/medium-api-docs
    status: 200
    finding: >-
      Complete API documentation, four sections (Overview, Authentication, Resources, Testing). No
      pricing, plan, quota, tier or billing section of any kind.
  - url: https://api.medium.com/v1/me
    status: 401
    finding: >-
      Returns {"errors":[{"message":"An access token is required.","code":6000}]} — an auth wall, not
      a paywall or a plan gate.
