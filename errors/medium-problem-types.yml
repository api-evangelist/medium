description: >-
  Error catalog for Medium's REST API, derived from the 4xx responses declared across the six
  refined OpenAPIs and enriched from the "Possible errors" tables in Medium's own documentation.
  One numeric error code was observed live: an unauthenticated GET https://api.medium.com/v1/me on
  2026-09-17 returned HTTP 401 with {"errors":[{"message":"An access token is required.","code":6000}]}.
format: bespoke
problem_details_rfc9457: false
envelope:
  media_type: application/json
  shape: '{"errors": [{"message": "<human readable>", "code": <integer>}]}'
  fields:
  - name: errors
    type: array
    description: One or more error objects. Always present on a failure response.
  - name: errors[].message
    type: string
    description: Human-readable description. This is the only field a client can show a user.
  - name: errors[].code
    type: integer
    description: >-
      Medium's internal numeric error code. NOT DOCUMENTED — Medium publishes no registry mapping
      these integers to meanings, so a client cannot branch on them safely. 6000 (access token
      required) is the only value confirmed by live observation; any other value is unknown.
  note: >-
    The envelope is not RFC 9457. There is no `type` URI, no `title`, no `status` in the body, no
    `detail` and no `instance`, and the media type is application/json rather than
    application/problem+json.
