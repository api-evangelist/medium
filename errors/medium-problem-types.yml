problem_types:
- status: 400
  title: Bad Request
  operations:
  - createUserPost
  - createPublicationPost
  conditions:
  - Required fields were invalid or not specified.
  - More than three tags were supplied on a post.
  - An unsupported contentFormat was supplied (only `html` and `markdown` are valid).
  remediation: >-
    Validate the request body against components.schemas.CreatePostRequest before sending. Medium
    does not name the offending field in the response, so the client must do its own validation.
  source: https://github.com/Medium/medium-api-docs#creating-a-post
- status: 401
  title: Unauthorized
  operations:
  - getAuthenticatedUser
  - listUserPublications
  - listPublicationContributors
  - createUserPost
  - createPublicationPost
  - uploadImage
  - exchangeAuthorizationCode
  - refreshAccessToken
  conditions:
  - The access token is invalid, was not supplied, or has been revoked by the user.
  - The access token lacks the scope the operation requires (for example `listPublications`).
  observed_code: 6000
  observed_message: An access token is required.
  remediation: >-
    Re-issue the integration token from https://medium.com/me/settings, or exchange the refresh
    token at POST /v1/tokens. Note that Medium no longer issues new integration tokens or accepts
    new OAuth integrations, so a 401 on a first-time integration is terminal, not transient.
  source: https://github.com/Medium/medium-api-docs#31-users
- status: 403
  title: Forbidden
  operations:
  - listUserPublications
  - createUserPost
  - createPublicationPost
  conditions:
  - The request attempts to list publications belonging to another user.
  - The authenticated user lacks permission to publish as the `authorId` in the path.
  - The `publicationId` in the path is not a publication the user may publish into.
  - A `writer` (as opposed to an `editor`) attempted to publish with a status other than `draft`.
  remediation: >-
    Call GET /v1/me first and use the returned `id` as `authorId`; call
    GET /v1/users/{userId}/publications and only post into publications returned there.
  source: https://github.com/Medium/medium-api-docs#creating-a-post-under-a-publication
- status: 429
  title: Too Many Requests
  operations: []
  conditions: []
  documented: false
  note: >-
    Not declared in any spec and not documented. Medium publishes no rate limit and no throttling
    response, so a client has no documented contract for backoff. Recorded here as an honest gap,
    not as an asserted behaviour.
retry_guidance:
  retryable_statuses: []
  note: >-
    Medium documents no retryable condition and no Retry-After header. Because no write operation
    supports an idempotency key (see conventions/), a blind retry of createUserPost or
    createPublicationPost risks publishing a duplicate post to a real, public profile.
