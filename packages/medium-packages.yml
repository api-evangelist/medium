description: >-
  First-party client libraries published by Medium for its OAuth2 REST API. Every one of them is
  dormant: the Node SDK's last npm release is 2016, the Go module's last proxied version is 2017,
  the Python SDK was never published to PyPI, and the official WordPress plugin was closed by
  Medium's own request in 2019. The API itself is marked "no longer supported" in Medium's own
  documentation repository, so the SDK decay tracks the product decision rather than neglect.
