description: 'Medium is an online publishing platform where writers publish stories and readers follow topics,
  publications and authors. Its developer surface is a small OAuth2 REST API at api.medium.com/v1 that lets an
  integration read the authenticated user''s profile, list the publications they write to or edit, upload images,
  and publish posts to a profile or into a publication. Medium states the API is no longer supported and does
  not accept new integrations: existing tokens continue to work, but new integration tokens have not been issued
  since 2023 and the documentation repository was archived in 2023.'
